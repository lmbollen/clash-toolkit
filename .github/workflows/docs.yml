name: Documentation

# The book is the documentation, so a change that breaks it should fail a build
# like anything else. Pushes to the default branch also publish it to GitHub
# Pages, which is where the README's documentation badge points.
#
# Publishing requires the repository's Pages source to be set to "GitHub Actions"
# (Settings → Pages); until then the build passes and the deploy step fails.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Let a new deployment replace an in-flight one rather than queue behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mdbook comes from the flake's `docs` shell, so its version is defined in
      # exactly one place: flake.lock. A separate pin here would drift from the
      # one developers actually use.
      - uses: cachix/install-nix-action@v31

      - run: nix develop .#docs --command mdbook build book

      # Available on pull requests too, so a docs change can be previewed
      # without waiting for it to land.
      - uses: actions/upload-artifact@v7
        with:
          name: book
          path: book/book

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: book/book
          # mdbook writes a .nojekyll file, and this action stopped including
          # dotfiles in v4.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to Pages
      id-token: write   # verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
